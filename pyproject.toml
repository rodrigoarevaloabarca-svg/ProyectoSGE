[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "SGE.settings"
python_files = ["tests.py", "test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.coverage.run]
source = ["."]
omit = [
    ".venv/*",
    "*/migrations/*",
    "*/tests*",
    "manage.py",
    "SGE/wsgi.py",
    "SGE/asgi.py",
]
